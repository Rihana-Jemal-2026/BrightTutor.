<div class="page">
  <div class="page-header">
    <div class="header-content">
      <h1>Mark Teacher Attendance</h1>
      <p class="subtitle">Record daily staff check-in, check-out, and attendance status</p>
    </div>
  </div>

  @if (resultMessage()) {
    <div class="alert alert-success">
      <span class="icon">✓</span> {{ resultMessage() }}
    </div>
  }
  @if (errorMessage()) {
    <div class="alert alert-error">
      <span class="icon">✕</span> {{ errorMessage() }}
    </div>
  }

  <div class="form-card">
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-grid">
        <!-- Searchable Teacher Selection -->
        <div class="field-group">
          <app-searchable-select
            label=" Select Teacher"
            placeholder="Choose Teacher..."
            searchPlaceholder="Type teacher name to search..."
            [options]="teacherOptions()"
            [value]="selectedTeacherId()"
            (valueChange)="onTeacherSelected($event)"
          ></app-searchable-select>
        </div>

        <!-- Date Selection -->
        <div class="field-group">
          <label for="attendanceDate">Attendance Date</label>
          <input id="attendanceDate" type="date" formControlName="attendanceDate" class="form-control" />
        </div>
      </div>

      <!-- Attendance Status Scenario Buttons -->
      <div class="field-group status-scenario-group">
        <label>Attendance Status Scenario</label>
        <div class="status-buttons">
          @for (option of statusOptions; track option.value) {
            <button
              type="button"
              class="btn-status"
              [class]="option.class"
              [class.active]="form.controls.status.value === option.value"
              (click)="setStatus(option.value)"
            >
              <span class="status-icon">{{ option.icon }}</span>
              <span class="status-label">{{ option.label }}</span>
            </button>
          }
        </div>
      </div>

      <div class="form-grid">
        <!-- Check-In Time -->
        <div class="field-group">
          <label for="checkInTime">Check-In Time</label>
          <input id="checkInTime" type="time" formControlName="checkInTime" class="form-control" />
        </div>

        <!-- Check-Out Time -->
        <div class="field-group">
          <label for="checkOutTime">Check-Out Time</label>
          <input id="checkOutTime" type="time" formControlName="checkOutTime" class="form-control" />
        </div>
      </div>

      <!-- Notes -->
      <div class="field-group">
        <label for="notes">Notes / Observations (Optional)</label>
        <input id="notes" formControlName="notes" placeholder="e.g. Approved leave, faculty meeting, or schedule adjustment" class="form-control" />
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-submit" [disabled]="form.invalid">
          ✓ Save Teacher Attendance
        </button>
      </div>
    </form>
  </div>
</div>
