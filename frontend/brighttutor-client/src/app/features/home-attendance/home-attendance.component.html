<div class="page">
  <h1>Home Attendance</h1>

  <div class="card">
    <h2>Check In</h2>

    @if (checkInResult()) { <div class="success">{{ checkInResult() }}</div> }
    @if (checkInError()) { <div class="error">{{ checkInError() }}</div> }

    <form [formGroup]="checkInForm" (ngSubmit)="submitCheckIn()">
      <label>Student ID</label>
      <input formControlName="studentId" placeholder="e.g. 33333333-3333-3333-3333-333333333333" />

      <label>Teacher ID</label>
      <input formControlName="teacherId" placeholder="e.g. 22222222-2222-2222-2222-222222222222" />

      <label>Class Group ID</label>
      <input formControlName="classGroupId" placeholder="e.g. 11111111-1111-1111-1111-111111111111" />

      <label>Date</label>
      <input type="date" formControlName="attendanceDate" />

      <div class="row">
        <div>
          <label>Latitude</label>
          <input type="number" step="0.0001" formControlName="checkInLatitude" />
        </div>
        <div>
          <label>Longitude</label>
          <input type="number" step="0.0001" formControlName="checkInLongitude" />
        </div>
      </div>

      <label>Address (optional)</label>
      <input formControlName="address" placeholder="e.g. Bole, Addis Ababa" />

      <label>Lesson Covered (optional)</label>
      <input formControlName="lessonCovered" placeholder="e.g. Fractions review" />

      <button type="submit" [disabled]="checkInForm.invalid">Check In</button>
    </form>
  </div>

  <div class="card">
    <h2>Check Out</h2>

    @if (checkOutResult()) { <div class="success">{{ checkOutResult() }}</div> }
    @if (checkOutError()) { <div class="error">{{ checkOutError() }}</div> }

    <form [formGroup]="checkOutForm" (ngSubmit)="submitCheckOut()">
      <label>Attendance ID</label>
      <input formControlName="attendanceId" placeholder="Auto-filled after check-in, or paste one" />

      <div class="row">
        <div>
          <label>Check-Out Latitude</label>
          <input type="number" step="0.0001" formControlName="checkOutLatitude" />
        </div>
        <div>
          <label>Check-Out Longitude</label>
          <input type="number" step="0.0001" formControlName="checkOutLongitude" />
        </div>
      </div>

      <button type="submit" [disabled]="checkOutForm.invalid">Check Out</button>
    </form>
  </div>
</div>
