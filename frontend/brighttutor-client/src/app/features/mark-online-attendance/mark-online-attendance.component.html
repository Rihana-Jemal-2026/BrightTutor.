<div class="online-attendance-page">
  <!-- Page Header -->
  <div class="header-card">
    <div class="header-content">
      <div class="header-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="28" height="28">
          <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V8h16v10zm-8-7c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
        </svg>
      </div>
      <div>
        <h1>Mark 1-on-1 Online Attendance</h1>
        <p class="subtitle">Record 1-on-1 private online video tutoring attendance for an assigned student.</p>
      </div>
    </div>
  </div>

  @if (resultMessage()) {
    <div class="alert alert-success">
      <span class="icon">✓</span>
      <span>{{ resultMessage() }}</span>
    </div>
  }

  @if (errorMessage()) {
    <div class="alert alert-danger">
      <span class="icon"></span>
      <span>{{ errorMessage() }}</span>
    </div>
  }

  <!-- Session Details Form -->
  <form [formGroup]="form" (ngSubmit)="submit()" class="form-card">
    <div class="form-grid">
      <div class="field-group">
        <app-searchable-select
          label=" Select Online Student"
          placeholder="Choose Student..."
          searchPlaceholder="Type student name to search..."
          [options]="studentOptions()"
          [value]="selectedStudentId()"
          (valueChange)="onStudentSelected($event)"
        ></app-searchable-select>
      </div>

      @if (!authService.isTeacher()) {
        <div class="field-group">
          <app-searchable-select
            label=" Select Teacher"
            placeholder="Choose Teacher..."
            searchPlaceholder="Type teacher name to search..."
            [options]="teacherOptions()"
            [value]="selectedTeacherId()"
            (valueChange)="onTeacherSelected($event)"
          ></app-searchable-select>
        </div>
      } @else {
        <div class="field-group">
          <label style="font-weight: 600; color: var(--color-text); display: block; margin-bottom: 0.35rem;"> Assigned Teacher</label>
          <input type="text" [value]="authService.currentUser()?.firstName + ' ' + authService.currentUser()?.lastName" class="form-control" style="background: var(--color-bg); padding: 0.65rem; border: 1px solid var(--color-border); border-radius: 8px;" readonly disabled />
        </div>
      }

      <div class="field-group">
        <label for="attendanceDate">Session Date *</label>
        <input id="attendanceDate" type="date" formControlName="attendanceDate" class="form-control" />
      </div>
    </div>

    <div class="field-group status-buttons-group">
      <label>Session Attendance Status</label>
      <div class="status-buttons">
        <button
          type="button"
          class="btn-status status-present"
          [class.active]="form.controls.status.value === AttendanceStatus.Present"
          (click)="setStatus(AttendanceStatus.Present)"
        >
          ✓ Present
        </button>
        <button
          type="button"
          class="btn-status status-absent"
          [class.active]="form.controls.status.value === AttendanceStatus.Absent"
          (click)="setStatus(AttendanceStatus.Absent)"
        >
          ✕ Absent
        </button>
        <button
          type="button"
          class="btn-status status-late"
          [class.active]="form.controls.status.value === AttendanceStatus.Late"
          (click)="setStatus(AttendanceStatus.Late)"
        >
           Late
        </button>
        <button
          type="button"
          class="btn-status status-excused"
          [class.active]="form.controls.status.value === AttendanceStatus.Excused"
          (click)="setStatus(AttendanceStatus.Excused)"
        >
           Excused
        </button>
      </div>
    </div>

    <div class="field-group">
      <label for="notes">Session Notes (Optional)</label>
      <input id="notes" formControlName="notes" placeholder="e.g. Covered Chapter 4 Algebra, camera and mic connected cleanly." class="form-control" />
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-submit" [disabled]="form.invalid">
        Submit Online Session Attendance
      </button>
    </div>
  </form>
</div>
