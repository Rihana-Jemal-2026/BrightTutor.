<div class="page">
  <h1>Mark Online Attendance</h1>

  @if (resultMessage()) { <div class="success">{{ resultMessage() }}</div> }
  @if (errorMessage()) { <div class="error">{{ errorMessage() }}</div> }

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label for="studentId">Student ID</label>
    <input id="studentId" formControlName="studentId" placeholder="e.g. 33333333-3333-3333-3333-333333333333" />

    <label for="teacherId">Teacher ID</label>
    <input id="teacherId" formControlName="teacherId" placeholder="e.g. 22222222-2222-2222-2222-222222222222" />

    <label for="classGroupId">Class Group ID</label>
    <input id="classGroupId" formControlName="classGroupId" placeholder="e.g. 11111111-1111-1111-1111-111111111111" />

    <label for="attendanceDate">Date</label>
    <input id="attendanceDate" type="date" formControlName="attendanceDate" />

    <label for="status">Status</label>
    <select id="status" formControlName="status">
      @for (option of statusOptions; track option.value) {
        <option [ngValue]="option.value">{{ option.label }}</option>
      }
    </select>

    <label for="notes">Notes (optional)</label>
    <input id="notes" formControlName="notes" />

    <button type="submit" [disabled]="form.invalid">Submit</button>
  </form>
</div>
